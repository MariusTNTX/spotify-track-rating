@let playbackState = spotifyData().playbackState;
@let mainPlaylistData = spotifyData().mainPlaylistData;

<main>
  <app-total-tracks-progress-bar 
    [percent]="mainPlaylistData?.playlistPercent || 0"
    [remainingTracks]="mainPlaylistData?.remainingTracks"
  ></app-total-tracks-progress-bar>

  <div class="variable-height-container">
    @if (showTrackSheet) {
      <app-current-track-info-sheet
        [trackName]="playbackState?.trackName"
        [albumName]="playbackState?.albumName"
        [albumImageURL]="playbackState?.albumImageUrl"
        [artistName]="playbackState?.artistName"
      ></app-current-track-info-sheet>
    } @else {
      <app-track-rating-button-grid 
        (doubleClick)="moveTrackToPlaylist($event)"
      ></app-track-rating-button-grid>
    }

    <app-current-track-info-button 
      [currentMilliseconds]="playbackState?.currentMillisecons"
      [totalMilliseconds]="playbackState?.totalMilliseconds"
      [percent]="playbackState?.trackPercent"
      (press)="showTrackSheet = $event"
    ></app-current-track-info-button>
  </div>

  <app-playback-actions-menu 
    [isPlaying]="playbackState?.isPlaying"
    [mustReShuffle]="playbackState?.mustShuffle"
    (skipPrevious)="onSkipPrevious()"
    (reShuffle)="onReShuffle()"
    (play)="onPlay()"
    (pause)="onPause()"
    (refresh)="onRefresh()"
    (skipNext)="onSkipNext()"
  ></app-playback-actions-menu>
</main>
